name: Windows build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Nyvora.sln -p:Platform=x64

      - name: Build (Release)
        run: dotnet build Nyvora.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/Nyvora.Tests/Nyvora.Tests.csproj -c Release --no-restore

      # Runs the real updater script (Windows PowerShell, as in production) against throwaway folders.
      - name: Test update helper (backup and rollback)
        shell: powershell
        run: ./tests/update-helper/Test-UpdateHelper.ps1

      - name: Publish app (development artifact)
        run: dotnet publish src/Nyvora.App/Nyvora.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o artifacts/Nyvora-win-x64

      # A machine without the .NET runtime must still start the app: the runtime has to be inside the folder.
      - name: Check the publish bundles the .NET runtime
        shell: pwsh
        run: |
          foreach ($f in 'coreclr.dll', 'hostfxr.dll', 'System.Private.CoreLib.dll') {
            if (-not (Test-Path "artifacts/Nyvora-win-x64/$f")) { throw "Missing $f: the build is not self-contained" }
          }
          "Self-contained: runtime files present"

      - uses: actions/upload-artifact@v4
        with:
          name: Nyvora-win-x64-dev
          path: artifacts/Nyvora-win-x64
          if-no-files-found: error

      # Launches the real published app on the runner's desktop and drives it (click, type, Esc, Settings, Quit).
      # Informational for now: it does not fail the build, but its results and screenshots are kept.
      - name: Smoke test the running app
        id: smoke
        continue-on-error: true
        shell: powershell
        run: ./tests/smoke/Smoke.ps1 -Exe "$PWD\artifacts\Nyvora-win-x64\Nyvora.exe" -OutDir "$PWD\artifacts\smoke"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: artifacts/smoke
          if-no-files-found: ignore
