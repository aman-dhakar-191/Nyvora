name: Windows build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Nyvora.sln -p:Platform=x64

      - name: Build (Release)
        run: dotnet build Nyvora.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/Nyvora.Tests/Nyvora.Tests.csproj -c Release --no-restore

      # Runs the real updater script (Windows PowerShell, as in production) against throwaway folders.
      - name: Test update helper (backup and rollback)
        shell: powershell
        run: ./tests/update-helper/Test-UpdateHelper.ps1

      - name: Publish app (development artifact)
        run: dotnet publish src/Nyvora.App/Nyvora.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o artifacts/Nyvora-win-x64

      # The MCP server ships next to the app and shares its bundled runtime.
      - name: Publish MCP server (into the app folder)
        run: dotnet publish src/Nyvora.Mcp/Nyvora.Mcp.csproj -c Release -r win-x64 --self-contained true -o artifacts/Nyvora-win-x64

      - name: Test the MCP server over stdio
        shell: pwsh
        run: ./tests/mcp/Test-Mcp.ps1 -Exe "$PWD\artifacts\Nyvora-win-x64\nyvora-mcp.exe"

      # A machine without the .NET runtime must still start the app: the runtime has to be inside the folder.
      - name: Check the publish bundles the .NET runtime
        shell: pwsh
        run: |
          foreach ($f in 'coreclr.dll', 'hostpolicy.dll', 'System.Private.CoreLib.dll') {
            if (-not (Test-Path "artifacts/Nyvora-win-x64/$f")) { throw "Missing ${f}: the build is not self-contained" }
          }
          "Self-contained: runtime files present"

      - name: Build the installer
        shell: pwsh
        env:
          NYVORA_VERSION: 9.9.9
        run: |
          choco install innosetup --no-progress -y | Out-Host
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DSourceDir=$PWD\artifacts\Nyvora-win-x64" "/O$PWD\artifacts\installer" installer\Nyvora.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Test the installer (silent install, MCP from the install, silent uninstall)
        shell: pwsh
        run: ./tests/installer/Test-Installer.ps1 -ExpectedVersion 9.9.9 -Setup (Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: Nyvora-win-x64-dev
          path: artifacts/Nyvora-win-x64
          if-no-files-found: error

      # Launches the real published app on the runner's desktop and drives it (click, type, Esc, Settings, Quit).
      # Informational for now: it does not fail the build, but its results and screenshots are kept.
      - name: Smoke test the running app
        id: smoke
        continue-on-error: true
        shell: powershell
        run: ./tests/smoke/Smoke.ps1 -Exe "$PWD\artifacts\Nyvora-win-x64\Nyvora.exe" -OutDir "$PWD\artifacts\smoke"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: artifacts/smoke
          if-no-files-found: ignore
